# Test profile overrides (full-context tests only — the @DataR2dbcTest / @WebFluxTest
# slices do not activate this profile). The full-context tests
# (TubeBffApplicationContextTest / OpenApiSpecDumpTest) extend the commons
# PostgresTestSupport base, which auto-wires the production Postgres R2DBC + Liquibase
# auto-config against a fresh per-class Testcontainers Postgres database — so NO
# autoconfig excludes here (the old H2 dual-connection excludes were the Boot-3
# workaround the Testcontainers base replaces). The context-load test runs a JWT-decoder
# mock so no live Casdoor is needed.

# Test keys: NONE here, on purpose. TokenCipher / GoogleConnectState / TubeMediaTokenService
# fail closed on a missing or short key, so the full-context tests publish well-formed,
# obviously-fake keys at runtime via @DynamicPropertySource ->
# src/test/java/net/hugmesh/tubebff/testsupport/TestProfileKeys.java. They used to be
# literals in this file, which lives in src/main/resources and so shipped in the jar.
# Prod sources tube.google.* and TUBE_MEDIA_KEY from ESO/Vault.
