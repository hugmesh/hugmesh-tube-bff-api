spring:
  application:
    name: hugmesh-tube-bff-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}"
          # Explicit JWKS so the resource server does NOT do OIDC discovery against
          # issuer-uri. On the local compose stack the issuer is the PUBLISHED
          # http://localhost:8000 (what the browser token carries in `iss`), but
          # inside a container localhost is the container itself — discovery dials
          # 127.0.0.1:8000, gets connection-refused, and depending on timing every
          # authenticated call answers a bare 401 or a 500 with nothing useful in
          # the logs. mod-bff hit and documented this first; this BFF never copied
          # the fix. iss is still validated via issuer-uri. Compose supplies
          # CASDOOR_JWKS_URI=http://casdoor:8000/.well-known/jwks.
          jwk-set-uri: "${CASDOOR_JWKS_URI:${CASDOOR_ISSUER_URI:https://id.snapdragon.systems}/.well-known/jwks}"

  # Runtime data access is REACTIVE (R2DBC) over the tube-bff governance store: the
  # tube_access use grant/timeout/ban overlay (PR2) + the tube_download_job work queue +
  # tube_storage_usage budgets + tube_subscription enqueue source (PR4). The
  # tube_google_link table arrives with the Google-connect path.
  r2dbc:
    url: "${SPRING_R2DBC_URL:r2dbc:postgresql://tube-bff-db.snapdragon-backend.svc.cluster.local:5432/tubebff}"
    username: "${SPRING_R2DBC_USERNAME:tubebff}"
    password: "${SPRING_R2DBC_PASSWORD:}"

  # Liquibase owns schema migrations. It has NO R2DBC runner, so it uses a plain
  # JDBC datasource — the ONLY JDBC use in the app; all runtime access is R2DBC.
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    url: "${SPRING_LIQUIBASE_URL:jdbc:postgresql://tube-bff-db.snapdragon-backend.svc.cluster.local:5432/tubebff}"
    user: "${SPRING_LIQUIBASE_USER:tubebff}"
    password: "${SPRING_LIQUIBASE_PASSWORD:}"

# ── Google (youtube.readonly) connect + refresh-token-at-rest (PR3) ──────────
# Every value here is ESO-projected from Vault at deploy time — the repo carries
# ONLY the env references + safe defaults, NEVER a secret. The dedicated Google OAuth
# Web client creds live in Vault secret/<brand>/tube-google (-> TUBE_GOOGLE_CLIENT_ID
# / _CLIENT_SECRET / _REDIRECT_URI); the per-service AES-256 DEK that encrypts the
# crown-jewel refresh token lives in Vault secret/<brand>/tube-token-dek (->
# TUBE_GOOGLE_DEK, base64 of exactly 32 bytes); the OAuth-state HMAC key is
# TUBE_GOOGLE_STATE_HMAC_KEY (base64, >=16 bytes). The blank defaults mean a context
# without the secrets fails closed when the connect endpoints are exercised
# (decodeDek()/decodeStateHmacKey() throw), never serving a degraded cipher.
tube:
  google:
    client-id: "${TUBE_GOOGLE_CLIENT_ID:}"
    client-secret: "${TUBE_GOOGLE_CLIENT_SECRET:}"
    redirect-uri: "${TUBE_GOOGLE_REDIRECT_URI:}"
    dek: "${TUBE_GOOGLE_DEK:}"
    state-hmac-key: "${TUBE_GOOGLE_STATE_HMAC_KEY:}"

# SpringDoc OpenAPI. The spec at /v3/api-docs is the source the platform
# ng-openapi-gen typed client (the paired hugmesh-tube-ui, PR6) + the docs
# pipeline consume. Spec + UI are gated by SecurityConfig: permitAll under dev/test (so
# `gen:fetch` can curl the spec without a token) and ROLE_ADMIN otherwise (prod).
springdoc:
  # ng-openapi-gen maps a response whose only media type is */* to a Blob (binary)
  # return type, which breaks JSON parsing in the generated typed client. Pinning the
  # default produced media type to application/json makes springdoc emit
  # `content: { application/json: ... }` for every controller method that does not
  # declare its own `produces`, so the generated client parses JSON. Any binary endpoint
  # that needs octet-stream still declares its own explicit `produces` and is unaffected.
  default-produces-media-type: application/json
  api-docs:
    enabled: true
    path: /v3/api-docs
    # Pin the dumped spec to OpenAPI 3.0.1. springdoc-openapi 3.x (pulled in by Boot 4)
    # defaults to emitting OpenAPI 3.1.0, whose type arrays break ng-openapi-gen 0.51.0
    # ("TypeError: type.startsWith is not a function"). Keep 3.0 for typed-client compat.
    version: openapi_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # Restrict the component scan to this BFF's own controllers so the spec stays the
  # tube-BFF surface only (no stray springframework/actuator paths leak in).
  packages-to-scan: net.hugmesh.tubebff

# Tube download work-queue (PR4) tunables. The default per-user storage budget seeded
# onto a new tube_storage_usage accounting row (bytes); an admin may raise/lower it per
# user via /bff/tube/admin/storage-budget. 10 GiB default. used_bytes >= budget_bytes ⇒
# the user is FULL and new download work is marked 'skipped' (pause-on-full).
app:
  tube:
    default-budget-bytes: "${TUBE_DEFAULT_BUDGET_BYTES:10737418240}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  # ── API-to-API mTLS enforcement (server side) ──────────────────────────────
  # When the in-cluster keystore initContainer is mounted (PKCS12 keystore.p12 =
  # this service's Vault-PKI identity + truststore.p12 = the cluster CA), the
  # deployment flips these on so the TLS handshake REQUIRES a client cert that chains
  # to the cluster CA. A caller that was NOT deployed+signed by our Vault/ESO PKI
  # process holds no such cert, so its handshake is rejected.
  #
  # Defaults keep local/dev/CI working: ssl.enabled=false (plaintext) and
  # client-auth=none, so the truststore is never opened and existing tests are
  # unaffected. In-cluster, the deployment sets SSL_ENABLED=true,
  # SSL_CLIENT_AUTH=need and points the key-store/trust-store at the mounted PKCS12
  # stores. The store passwords are generated in-pod and injected via env.
  ssl:
    enabled: "${SSL_ENABLED:false}"
    client-auth: "${SSL_CLIENT_AUTH:none}"
    key-store: "${SSL_KEY_STORE:/stores/keystore.p12}"
    key-store-type: "${SSL_KEY_STORE_TYPE:PKCS12}"
    key-store-password: "${SSL_KEY_STORE_PASSWORD:}"
    trust-store: "${SSL_TRUST_STORE:/stores/truststore.p12}"
    trust-store-type: "${SSL_TRUST_STORE_TYPE:PKCS12}"
    trust-store-password: "${SSL_TRUST_STORE_PASSWORD:}"
    # TLSv1.3 floor (forward-secret, AEAD-only) — matches the gateway chart.
    enabled-protocols: "${SSL_ENABLED_PROTOCOLS:TLSv1.3}"
