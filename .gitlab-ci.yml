# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (the canonical .pentest-* hidden
# jobs: SCA via OWASP Dependency-Check + authenticated ZAP DAST baseline driven by
# the shared run-pentest.sh harness). ONE source of truth lives in the generator
# repo; the thin pentest:* jobs below just `extends:` those. See memory
# hugmesh-pentest-standard / hugmesh-nuclei-integration.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, build, pentest]

# Run the unit/slice tests before the image build (./mvnw test). Keeps a broken
# overlay/guard from shipping an image. Matches the owncast-bff / wiki-bff CI test stage.
#
# Spring Boot 4 upgrade: the full-context tests (TubeBffApplicationContextTest /
# OpenApiSpecDumpTest) extend the commons PostgresTestSupport base, which spins up a
# real Postgres via Testcontainers — so the test job needs a Docker daemon. We attach a
# docker:dind service and point the Testcontainers docker-java client at it
# (mirrors federation-api's Boot-4 CI #43). Ryuk is disabled (the dind container is
# torn down with the job) and -Dapi.version=1.43 pins the docker-java API version this
# environment's daemon negotiation needs (the DOCKER_API_VERSION env var is NOT honoured
# by docker-java here — only the sysprop is).
test:unit:
  stage: test
  image: eclipse-temurin:25-jdk
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HOST_OVERRIDE: docker
    MAVEN_OPTS: "-Dapi.version=1.43"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # -s settings.xml points Maven at the gitlab-maven GROUP registry so the PRIVATE
    # hugmesh-commons / hugmesh-parent artifacts resolve (CI_JOB_TOKEN is injected
    # by GitLab; CI_API_V4_URL is predefined; GITLAB_GROUP_ID is a CI/CD or group
    # variable). Locally a plain `./mvnw test` resolves them from ~/.m2 instead.
    - ./mvnw -B -s settings.xml -DskipITs test

build:image:
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE hugmesh-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the HugMesh
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# ── pentest stage — OWASP SCA + authenticated ZAP DAST ───────────────────────
# Thin jobs that extend the centralized hidden jobs from the included generator
# template. allow_failure: true keeps findings NON-blocking for now (report-and-
# fix posture); rules mirror this repo's existing security/test jobs
# (default-branch + merge_request). The full DAST harness (probes + nuclei) runs
# via .pentest-dast-baseline.
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
